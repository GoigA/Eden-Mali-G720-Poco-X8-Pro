name: Build Mali-G720 Custom Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set up Ninja
        uses: ninja-build/setup-ninja@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static

      - name: Build Shared Library (.so)
        run: |
          cmake --build build --config Release --target vulkan_mali_tbdr

      - name: Strip Debug Symbols
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all build/libvulkan_mali_tbdr.so

      - name: Package Custom Driver (.zip)
        run: |
          mkdir -p dist
          cp build/libvulkan_mali_tbdr.so dist/
          cp custom-driver-package/meta.json dist/
          cd dist
          zip -9 -r ../mali-g720-tbdr-interceptor-arm64.zip meta.json libvulkan_mali_tbdr.so
          cd ..

      - name: Upload Driver ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mali-g720-tbdr-interceptor-eden
          path: mali-g720-tbdr-interceptor-arm64.zip
          retention-days: 30

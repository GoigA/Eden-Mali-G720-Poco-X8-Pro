name: Build Eden APK (Mali-G720 & Poco X8 Pro Optimized)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Clone Eden Latest (Nightly Mainline)
        run: |
          echo "Clonando repositorio oficial do Eden..."
          git clone --depth 1 --recurse-submodules --shallow-submodules https://git.eden-emu.dev/eden-emu/eden.git eden-src

      - name: Apply Robert's Mali-G720 & TBDR Fixes
        run: |
          cd eden-src
          echo "Aplicando patch de remocao de travas Mali, barreiras TBDR e SMMU/nvmap..."
          git apply --reject --whitespace=fix ../patches/0001-robert-mali-g720-tbdr.patch || patch -p1 -N -i ../patches/0001-robert-mali-g720-tbdr.patch || true
          git status

      - name: Configure Runner NDK & SDK in Gradle
        run: |
          cd eden-src/src/android/app
          # Usa o NDK nativo do runner do GitHub
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          echo "NDK nativo encontrado no sistema: $NDK_DIR"
          
          # Remove exigencia de versao fixa de NDK proprietario
          sed -i '/ndkVersion = /d' build.gradle.kts
          # Ajusta versao de compilacao para Android SDK compativel
          sed -i 's/compileSdkVersion = "android-36"/compileSdkVersion = "android-35"/g' build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 35/g' build.gradle.kts

      - name: Build Android APK
        run: |
          cd eden-src/src/android
          chmod +x gradlew
          
          # Aceita licencas do SDK do Android se necessario
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Executa a compilacao do APK
          ./gradlew assembleMainlineRelWithDebInfo --no-daemon --stacktrace || ./gradlew assembleMainlineRelease --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect Generated APKs
        run: |
          mkdir -p output-apk
          find eden-src/src/android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          ls -la output-apk/

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Eden-PocoX8Pro-MaliG720-Optimized
          path: output-apk/*.apk
          retention-days: 30

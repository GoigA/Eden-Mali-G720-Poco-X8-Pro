name: Build Eden APK (Mali-G720 & Poco X8 Pro Optimized)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install CMake 3.31+ & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache python3-pip
          python3 -m pip install --upgrade "cmake>=3.31.0"
          echo "Versao do CMake instalada:"
          cmake --version

      - name: Clone Eden Latest (Nightly Mainline)
        run: |
          echo "Clonando repositorio oficial do Eden..."
          git clone --depth 1 --recurse-submodules --shallow-submodules https://git.eden-emu.dev/eden-emu/eden.git eden-src

      - name: Apply Robert's Mali-G720 & TBDR Fixes
        run: |
          cd eden-src
          echo "Aplicando patch de remocao de travas Mali, barreiras TBDR e SMMU/nvmap..."
          git apply --reject --whitespace=fix ../patches/0001-robert-mali-g720-tbdr.patch || patch -p1 -N -i ../patches/0001-robert-mali-g720-tbdr.patch || true
          git status

      - name: Configure CMake & NDK in Gradle
        run: |
          cd eden-src/src/android
          
          # Aponta cmake.dir no local.properties para o CMake 3.31 instalado no sistema
          CMAKE_BIN=$(which cmake)
          CMAKE_DIR=$(dirname $(dirname $CMAKE_BIN))
          echo "cmake.dir=$CMAKE_DIR" > local.properties
          cat local.properties
          
          cd app
          # Remove a exigencia de versao fixa de CMake do SDK para usar o CMake 3.31 do PATH/cmake.dir
          sed -i '/version = "3.31.6"/d' build.gradle.kts
          # Remove versao fixa do NDK para usar o NDK nativo do runner
          sed -i '/ndkVersion = /d' build.gradle.kts
          # Ajusta compatibilidade do SDK
          sed -i 's/compileSdkVersion = "android-36"/compileSdkVersion = "android-35"/g' build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 35/g' build.gradle.kts

      - name: Build Android APK (Poco X8 Pro - ARM64 Only)
        run: |
          cd eden-src/src/android
          chmod +x gradlew
          
          # Aceita licencas do SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          # Compila EXCLUSIVAMENTE a versao ARM64 (Mainline) para o Poco X8 Pro
          ./gradlew :app:assembleMainlineRelWithDebInfo --no-daemon --stacktrace

      - name: Collect Generated APKs
        run: |
          mkdir -p output-apk
          find eden-src/src/android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          ls -la output-apk/

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Eden-PocoX8Pro-MaliG720-Optimized
          path: output-apk/*.apk
          retention-days: 30

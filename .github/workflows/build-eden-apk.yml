name: Build Eden APK (Mali-G720 & Poco X8 Pro Optimized)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK r26d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set up Ninja & ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Clone Eden Latest (Nightly Mainline)
        run: |
          echo "Clonando repositorio oficial do Eden..."
          git clone --depth 1 --recurse-submodules --shallow-submodules https://git.eden-emu.dev/eden-emu/eden.git eden-src

      - name: Apply Robert's Mali-G720 & TBDR Fixes
        run: |
          cd eden-src
          echo "Aplicando patch de remocao de travas Mali, barreiras TBDR e SMMU/nvmap..."
          git apply --reject --whitespace=fix ../patches/0001-robert-mali-g720-tbdr.patch || patch -p1 -N -i ../patches/0001-robert-mali-g720-tbdr.patch || true
          git status

      - name: Build Android APK
        run: |
          cd eden-src/src/android
          chmod +x gradlew
          # Compila a versao de release do Eden com o patch integrado
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleOptimizedRelease --no-daemon --stacktrace || ./gradlew assembleStandardRelease --no-daemon --stacktrace

      - name: Collect Generated APKs
        run: |
          mkdir -p output-apk
          find eden-src/src/android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          ls -la output-apk/

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Eden-PocoX8Pro-MaliG720-Optimized
          path: output-apk/*.apk
          retention-days: 30

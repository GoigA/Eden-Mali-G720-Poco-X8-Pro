name: Build Eden Mali-G720 APK (Poco X8 Pro)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies (glslangValidator & Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build ccache
          glslangValidator --version || which glslangValidator

      - name: Setup Android SDK Components
        run: |
          echo "Instalando CMake 3.22.1 e aceitando licenças..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "platforms;android-35" || true

      - name: Clone Eden Mali-G720 Source (Robert Khairislamov)
        run: |
          echo "Clonando repositorio com todas as correções Mali-G720 / Immortalis..."
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/robertkhairislamov-afk/eden-mali-gpu-fix-samsung-tab-s10.git eden-src

      - name: Configure Gradle Build Settings
        run: |
          cd eden-src/src/android
          
          # Cria local.properties apontando para o SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Ajusta compatibilidade para SDK 35 e remove NDK version rígida para usar o NDK nativo do runner
          cd app
          sed -i '/ndkVersion = /d' build.gradle.kts
          sed -i 's/compileSdkVersion = "android-36"/compileSdkVersion = "android-35"/g' build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 35/g' build.gradle.kts
          
          # Garante que o CMake 3.22.1 instalado no SDK seja o utilizado
          sed -i 's/version = "3.31.6"/version = "3.22.1"/g' build.gradle.kts

      - name: Build Android APK (Mainline ARM64)
        run: |
          cd eden-src/src/android
          chmod +x gradlew
          ./gradlew :app:assembleMainlineRelease --no-daemon --stacktrace

      - name: Collect Generated APKs
        run: |
          mkdir -p output-apk
          find eden-src/src/android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          ls -la output-apk/

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-MaliG720-PocoX8Pro-Release
          path: output-apk/*.apk
          retention-days: 30
